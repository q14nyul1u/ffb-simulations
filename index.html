<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulationen Elektrotechnik</title>
<style>
:root{
  /* FFBS-Farben wie im Ohm-Labor. Layout: Kopfzeile, darunter ein Raster aus Kacheln;
     nach der Auswahl füllt die Simulation die Seite, eine schmale Leiste führt zurück. */
  --navy:#3F4A6E; --navy-tief:#2E3754; --gruen:#71B390; --hellgruen:#E6F2EB;
  --papier:#F3F5F8; --karte:#FFFFFF; --linie:#D5D9E3; --text:#1E2333; --leise:#5A6178;
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--papier);color:var(--text);font-family:var(--font);display:flex;flex-direction:column}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gruen);outline-offset:3px}

/* Übersicht */
.kopf{background:var(--navy);color:#fff;padding:26px 24px 24px;border-bottom:5px solid var(--gruen)}
.kopf .innen,.inhalt{max-width:1180px;margin:0 auto;width:100%}
.kopf h1{margin:0;font-size:28px;line-height:1.2;text-wrap:balance}
.kopf p{margin:8px 0 0;font-size:16px;line-height:1.45;opacity:.88;max-width:62ch}
.inhalt{padding:24px 24px 40px}
.zaehler{font-size:14px;color:var(--leise);margin:0 0 14px}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;list-style:none;margin:0;padding:0}
.kachel{display:flex;flex-direction:column;height:100%;background:var(--karte);border:1px solid var(--linie);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s, box-shadow .15s, border-color .15s}
.kachel:hover{transform:translateY(-3px);border-color:var(--navy);box-shadow:0 10px 24px rgba(46,55,84,.16)}
.kachel .bild{background:var(--hellgruen);border-bottom:1px solid var(--linie);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.kachel .bild svg{width:100%;height:100%;display:block}
.kachel .rumpf{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.kachel .thema{font-size:12.5px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.kachel h2{margin:0;font-size:21px;line-height:1.25;text-wrap:balance}
.kachel p{margin:0;font-size:15px;line-height:1.5;color:var(--leise)}
.kachel .start{margin-top:auto;padding-top:10px}
.kachel .start span{display:inline-block;background:var(--navy);color:#fff;font-weight:bold;font-size:15px;padding:9px 14px;border-radius:8px}
.kachel:hover .start span{background:var(--navy-tief)}
.fuss{font-size:13px;color:var(--leise);margin:26px 0 0}

/* Simulation */
#spieler{flex:1;display:flex;flex-direction:column;min-height:0}
.leiste{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 14px;flex:none}
.leiste a{color:#fff;text-decoration:none;font-weight:bold;font-size:14.5px;border:1.5px solid rgba(255,255,255,.55);border-radius:8px;padding:7px 12px;white-space:nowrap}
.leiste a:hover{background:#fff;color:var(--navy)}
.leiste strong{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rahmen{flex:1;width:100%;border:0;background:#fff;min-height:0}

@media (max-width:480px){
  .kopf{padding:20px 16px}.kopf h1{font-size:23px}
  .inhalt{padding:18px 16px 32px}
  .leiste a .lang{display:none}
}
@media (prefers-reduced-motion:reduce){.kachel{transition:none}.kachel:hover{transform:none}}
</style>
</head>
<body>

<div id="uebersicht">
  <header class="kopf"><div class="innen">
    <h1>Simulationen Elektrotechnik</h1>
    <p>Wählen Sie eine Simulation aus. Sie startet sofort im Browser, ohne Anmeldung und ohne Installation.</p>
  </div></header>
  <main class="inhalt">
    <p class="zaehler" id="zaehler"></p>
    <ul class="kacheln" id="kacheln"></ul>
    <p class="fuss">Über „Alle Simulationen“ oben links kommen Sie jederzeit hierher zurück.</p>
  </main>
</div>

<div id="spieler" hidden>
  <div class="leiste">
    <a href="#" id="zurueck">← <span class="lang">Alle </span>Simulationen</a>
    <strong id="simTitel"></strong>
  </div>
  <iframe id="rahmen" title="Simulation"></iframe>
</div>

<script>
/* =====================================================================
   LISTE DER SIMULATIONEN
   Neue Simulation hinzufügen:
     1. HTML-Datei in den Ordner "sim" legen (Dateiname ohne Leerzeichen/Umlaute).
     2. Unten einen neuen Block { ... } ergänzen.
   id     = kurzer Name für die Adresse (nur Kleinbuchstaben, Ziffern, Bindestrich)
   bild   = Name eines Bildes aus BILDER (weiter unten); weglassen = Standardbild
   ===================================================================== */
const SIMULATIONEN = [
  {
    id: "ohm-labor",
    titel: "Ohm-Labor: Taschenlampe",
    thema: "Ohmsches Gesetz",
    text: "Spannung und Widerstand einstellen, Strom messen und beobachten, wie hell das Lämpchen leuchtet. Mit Kennlinien und Messwerttabelle.",
    datei: "sim/ohm-labor.html",
    bild: "stromkreis"
  },
  {
    id: "zaehlerschrank",
    titel: "Zählerschrank planen und bestücken",
    thema: "VDE-AR-N 4100 · TAB SWM",
    text: "Für drei Gebäude die Zähler- und Verteilerfelder planen, die Bauteile per Drag & Drop einsetzen und die Bestückung prüfen lassen.",
    datei: "sim/zaehlerschrank.html",
    bild: "schrank"
  }
];

/* Bilder für die Kacheln (einfache Zeichnungen, 320 × 180) */
const BILDER = {
  stromkreis: `<svg viewBox="0 0 320 180" aria-hidden="true">
    <circle cx="232" cy="90" r="46" fill="#F5C542" opacity=".45"/>
    <g fill="none" stroke="#1E2333" stroke-width="4" stroke-linecap="round">
      <path d="M72 78V40h160v22M232 118v22H72v-38"/>
      <path d="M52 78h40"/>
    </g>
    <path d="M60 102h24" stroke="#1E2333" stroke-width="9" stroke-linecap="round"/>
    <circle cx="150" cy="40" r="17" fill="#fff" stroke="#1E2333" stroke-width="4"/>
    <text x="150" y="47" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#1E2333">A</text>
    <circle cx="232" cy="90" r="28" fill="#fff" stroke="#1E2333" stroke-width="4"/>
    <path d="M212 70l40 40M212 110l40-40" stroke="#1E2333" stroke-width="4"/>
    <text x="38" y="84" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#3F4A6E">+</text>
  </svg>`,
  schrank: `<svg viewBox="0 0 320 180" aria-hidden="true">
    <rect x="78" y="14" width="164" height="152" rx="5" fill="#D9DBD6" stroke="#8D9398" stroke-width="2"/>
    <rect x="88" y="24" width="68" height="132" rx="2" fill="#FBFBF9" stroke="#C3C6C0"/>
    <rect x="164" y="24" width="68" height="132" rx="2" fill="#FBFBF9" stroke="#C3C6C0"/>
    <rect x="100" y="50" width="44" height="52" rx="4" fill="#E9EAE7" stroke="#8D9398" stroke-width="1.5"/>
    <rect x="106" y="60" width="32" height="14" rx="2" fill="#B9C7A6" stroke="#6C7563"/>
    <circle cx="134" cy="90" r="4" fill="#333"/>
    <g fill="#E0A36A" stroke="#8F5428" stroke-width=".6">
      <rect x="92" y="122" width="60" height="4"/><rect x="92" y="130" width="60" height="4"/><rect x="92" y="138" width="60" height="4"/>
    </g>
    <rect x="108" y="116" width="18" height="28" rx="2" fill="#E9EAEB" stroke="#8D9398"/><rect x="111" y="126" width="12" height="7" fill="#D32F2F"/>
    <g>
      <rect x="170" y="42" width="56" height="8" fill="#C9CDD1"/><rect x="170" y="84" width="56" height="8" fill="#C9CDD1"/><rect x="170" y="126" width="56" height="8" fill="#C9CDD1"/>
    </g>
    <g fill="#fff" stroke="#8D9398">
      <rect x="172" y="32" width="18" height="28" rx="2"/><rect x="192" y="32" width="8" height="28" rx="1.5"/><rect x="202" y="32" width="8" height="28" rx="1.5"/><rect x="212" y="32" width="8" height="28" rx="1.5"/>
      <rect x="172" y="74" width="18" height="28" rx="2"/><rect x="192" y="74" width="8" height="28" rx="1.5"/><rect x="202" y="74" width="8" height="28" rx="1.5"/>
    </g>
    <g fill="#3F4A6E"><rect x="174" y="42" width="14" height="7"/><rect x="194" y="42" width="4" height="7"/><rect x="204" y="42" width="4" height="7"/><rect x="214" y="42" width="4" height="7"/>
      <rect x="174" y="84" width="14" height="7"/><rect x="194" y="84" width="4" height="7"/><rect x="204" y="84" width="4" height="7"/></g>
    <g><rect x="172" y="120" width="24" height="18" fill="#2A6FD1"/><rect x="200" y="120" width="24" height="18" fill="#4CAF50"/><rect x="206" y="120" width="5" height="18" fill="#F2D335"/><rect x="216" y="120" width="5" height="18" fill="#F2D335"/></g>
  </svg>`,
  standard: `<svg viewBox="0 0 320 180" aria-hidden="true">
    <rect x="96" y="40" width="128" height="88" rx="8" fill="#fff" stroke="#3F4A6E" stroke-width="4"/>
    <path d="M112 104l26-30 20 18 30-36 20 24" fill="none" stroke="#71B390" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M136 146h48M160 128v18" stroke="#3F4A6E" stroke-width="4" stroke-linecap="round"/>
  </svg>`
};

/* ---------- ab hier muss nichts geändert werden ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const STARTTITEL = document.title;

$("kacheln").innerHTML = SIMULATIONEN.map(s => `
  <li><a class="kachel" href="#${esc(s.id)}">
    <div class="bild">${BILDER[s.bild] || BILDER.standard}</div>
    <div class="rumpf">
      <span class="thema">${esc(s.thema || "")}</span>
      <h2>${esc(s.titel)}</h2>
      <p>${esc(s.text || "")}</p>
      <div class="start"><span>Simulation starten →</span></div>
    </div>
  </a></li>`).join("");
$("zaehler").textContent = SIMULATIONEN.length + (SIMULATIONEN.length === 1 ? " Simulation" : " Simulationen");

let aktiv = null;
function zeige() {
  const id = decodeURIComponent(location.hash.slice(1));
  const sim = SIMULATIONEN.find(s => s.id === id) || null;
  $("uebersicht").hidden = !!sim;
  $("spieler").hidden = !sim;
  if (sim) {
    if (aktiv !== sim.id) $("rahmen").src = sim.datei;   // nur neu laden, wenn gewechselt wurde
    $("rahmen").title = sim.titel;
    $("simTitel").textContent = sim.titel;
    document.title = sim.titel;
  } else {
    $("rahmen").removeAttribute("src");                    // Simulation beenden
    document.title = STARTTITEL;
    window.scrollTo(0, 0);
  }
  aktiv = sim ? sim.id : null;
}
$("zurueck").addEventListener("click", e => {
  e.preventDefault();
  if (location.hash) location.hash = "";
  zeige();
});
window.addEventListener("hashchange", zeige);
zeige();
</script>
</body>
</html>
